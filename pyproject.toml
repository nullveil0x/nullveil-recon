[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullveil-recon"
version = "3.7.0"
description = "NULLVEIL Recon — defensive, read-only attack-surface reconnaissance & reporting (48 modules: discovery, verification, intelligence)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "NULLVEIL" }]
keywords = ["security", "recon", "reconnaissance", "pentest", "osint", "attack-surface", "cvss", "mitre-attack"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "dnspython>=2.4.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60", "playwright>=1.40"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/nullveil0x/nullveil-recon"
Repository = "https://github.com/nullveil0x/nullveil-recon"
Issues = "https://github.com/nullveil0x/nullveil-recon/issues"
Changelog = "https://github.com/nullveil0x/nullveil-recon/commits/main"

[project.scripts]
nullveil-recon = "nullveil_recon:main"

[tool.setuptools]
py-modules = ["nullveil_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
